name: Release Vellum

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Typecheck & Test UI
        working-directory: ui
        run: |
          npm run typecheck
          npm test

      - name: Build UI bundle
        working-directory: ui
        run: npm run build

      - name: Run .NET tests
        run: dotnet test tests/Vellum.Tests/Vellum.Tests.csproj -c Release

      - name: Generate icon & publish lightweight single-file exe
        shell: pwsh
        run: |
          ./scripts/build.ps1
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path dist/Vellum.exe -DestinationPath release-assets/Vellum-win-x64-lightweight.zip -Force

      - name: Publish standalone self-contained exe
        shell: pwsh
        run: |
          ./scripts/build.ps1 -SelfContained -SkipUiBuild
          Compress-Archive -Path dist/Vellum.exe -DestinationPath release-assets/Vellum-win-x64-standalone.zip -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Vellum-win-x64-lightweight.zip
            release-assets/Vellum-win-x64-standalone.zip
          generate_release_notes: true
